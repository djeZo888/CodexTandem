<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">CodexTandem ownership and optional advice</title>
<desc id="desc">Workers own disjoint files and tests. The orchestrator owns the contract, review, integration and shared resource gates. An optional read-only advisor owns no files or resources and returns advice only to the orchestrator.</desc>
<rect width="1500" height="1000" rx="20" fill="#f8faff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6f82a3" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="advice-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ad7420" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="45" y="56" fill="#172644" font-size="31" font-weight="700" text-anchor="start">Parallel implementation. One owner per file and resource.</text>
<text x="45" y="89" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Adding an advisor adds a second opinion, not a second orchestrator or a new resource owner.</text>
<path d="M 330 382 L 365 382 L 365 218 L 405 218" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 365 382 L 405 398" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 365 382 L 365 578 L 405 578" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 735 218 L 770 218 L 770 340 L 800 340" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 735 398 L 770 398 L 770 340" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M 735 578 L 770 578 L 770 340" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M 1060 340 L 1130 340" fill="none" stroke="#6f82a3" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 900 436 L 900 690" fill="none" stroke="#ad7420" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#advice-arrow)"/>
<path d="M 1010 690 L 1010 436" fill="none" stroke="#ad7420" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#advice-arrow)"/>
<rect x="45" y="285" width="285" height="195" rx="16" fill="#eaf0ff" stroke="#4261b9" stroke-width="1.6"/>
<rect x="63" y="306" width="5" height="25" rx="2.5" fill="#4261b9"/>
<text x="80" y="327" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Agreed contract</text>
<text x="69" y="363" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Interfaces + base SHA</text>
<text x="69" y="391" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Owners + acceptance</text>
<text x="69" y="419" fill="#586985" font-size="18" font-weight="400" text-anchor="start">User-selected timebox</text>
<rect x="405" y="145" width="330" height="145" rx="16" fill="#e9f7f4" stroke="#208c80" stroke-width="1.6"/>
<rect x="423" y="166" width="5" height="25" rx="2.5" fill="#208c80"/>
<text x="440" y="187" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Worker 1</text>
<text x="429" y="223" fill="#586985" font-size="18" font-weight="400" text-anchor="start">API files + tests</text>
<text x="429" y="251" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Isolated checkout A</text>
<rect x="405" y="325" width="330" height="145" rx="16" fill="#e9f7f4" stroke="#208c80" stroke-width="1.6"/>
<rect x="423" y="346" width="5" height="25" rx="2.5" fill="#208c80"/>
<text x="440" y="367" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Worker 2</text>
<text x="429" y="403" fill="#586985" font-size="18" font-weight="400" text-anchor="start">UI files + tests</text>
<text x="429" y="431" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Isolated checkout B</text>
<rect x="405" y="505" width="330" height="145" rx="16" fill="#e9f7f4" stroke="#208c80" stroke-width="1.6"/>
<rect x="423" y="526" width="5" height="25" rx="2.5" fill="#208c80"/>
<text x="440" y="547" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Worker 3</text>
<text x="429" y="583" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Adapter files + tests</text>
<text x="429" y="611" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Isolated checkout C</text>
<rect x="800" y="270" width="260" height="166" rx="16" fill="#eaf0ff" stroke="#4261b9" stroke-width="1.6"/>
<rect x="818" y="291" width="5" height="25" rx="2.5" fill="#4261b9"/>
<text x="835" y="312" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Review gate</text>
<text x="824" y="348" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Diff + logs + exits</text>
<text x="824" y="376" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Verified closure</text>
<text x="824" y="404" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Orchestrator decides</text>
<rect x="1130" y="270" width="325" height="222" rx="16" fill="#f3edfb" stroke="#8c68b3" stroke-width="1.6"/>
<rect x="1148" y="291" width="5" height="25" rx="2.5" fill="#8c68b3"/>
<text x="1165" y="312" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Serial integration</text>
<text x="1154" y="348" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Integration checkout</text>
<text x="1154" y="376" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Protected default branch</text>
<text x="1154" y="404" fill="#586985" font-size="17" font-weight="400" text-anchor="start">GPU / VM / service / device</text>
<text x="1154" y="432" fill="#586985" font-size="17" font-weight="400" text-anchor="start">One active resource owner</text>
<rect x="867.2" y="536" width="65.6" height="25" rx="4" fill="#f8faff"/>
<text x="900" y="555" fill="#ad7420" font-size="16" font-weight="500" text-anchor="middle">brief</text>
<rect x="972.6" y="566" width="74.7" height="25" rx="4" fill="#f8faff"/>
<text x="1010" y="585" fill="#ad7420" font-size="16" font-weight="500" text-anchor="middle">advice</text>
<rect x="800" y="690" width="655" height="180" rx="16" fill="#fff3db" stroke="#ad7420" stroke-width="1.6"/>
<rect x="818" y="711" width="5" height="25" rx="2.5" fill="#ad7420"/>
<text x="835" y="732" fill="#172644" font-size="23" font-weight="650" text-anchor="start">Optional advisor · e.g. Fable 5.2</text>
<text x="824" y="768" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Read-only: no file ownership, edits, dispatch, or integration</text>
<text x="824" y="796" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Consult only on a user plan-review request or when both</text>
<text x="824" y="824" fill="#586985" font-size="17" font-weight="400" text-anchor="start">the assigned worker and orchestrator cannot find a solution.</text>
<text x="824" y="852" fill="#586985" font-size="17" font-weight="400" text-anchor="start">Advice is evidence for the orchestrator to verify.</text>
<text x="570" y="696" fill="#208c80" font-size="18" font-weight="600" text-anchor="middle">Disjoint work can run together.</text>
<text x="45" y="940" fill="#586985" font-size="18" font-weight="400" text-anchor="start">Most implementation can stay with lower-cost capable models. Premium reasoning is a selective escalation.</text>
<text x="45" y="969" fill="#586985" font-size="17" font-weight="400" text-anchor="start">If the advisor is disabled or unavailable, keep ownership unchanged and make any required review decision explicit.</text>
</g>
</svg>
